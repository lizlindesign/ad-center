<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages
    // Detects which version we're trying to access and redirects to its index.html
    var path = location.pathname;
    var segments = path.split('/').filter(Boolean);
    
    // Find the version folder (v1-store-rows, v2-dma, v3-aggregated, v4-polished)
    var versionFolders = ['v1-store-rows', 'v2-dma', 'v3-aggregated', 'v4-polished'];
    var versionIndex = -1;
    var version = null;
    
    for (var i = 0; i < segments.length; i++) {
      if (versionFolders.indexOf(segments[i]) !== -1) {
        versionIndex = i;
        version = segments[i];
        break;
      }
    }
    
    if (version) {
      // Store the full path for the SPA to pick up
      sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
      // Redirect to the version's index.html
      var basePath = '/' + segments.slice(0, versionIndex + 1).join('/') + '/';
      location.replace(basePath);
    } else {
      // Not a version path, redirect to root
      location.replace('/pages/q0l048f/walmart-ad-center/');
    }
  </script>
</head>
<body>Redirecting...</body>
</html>
